# Regression cases: romanized input -> expected Thai top-1 candidate.
#
# Run interactively in thaime_tui (F5) and headlessly by `cargo test`
# (crates/thaime_engine/tests/regression.rs), with default ranking params,
# the pinned n-gram binary, and no context.
#
# `snapshot_top1` records the current top-1 of a case that does not yet meet
# `expected_thai` (a known target). `cargo test` asserts the snapshot: every
# case returns `snapshot_top1` if set, else `expected_thai`. A change that
# alters any top-1 updates this file in the same commit.

