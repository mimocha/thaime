# SPDX-License-Identifier: MPL-2.0

[package]
name = "thaime_engine"
description = "THAIME Core engine library"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["embed-dict"]
embed-dict = []
embed-ngram = []

[dependencies]
yada = "0.5"
serde = { version = "1", features = ["derive"] }
bincode = "1"

[dev-dependencies]
toml = "0.8"

[[test]]
name = "regression"
required-features = ["embed-dict"]
