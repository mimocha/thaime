# SPDX-License-Identifier: MPL-2.0
# Build WASM + Vite demo and deploy to GitHub Pages.

name: Deploy Web Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package
        run: wasm-pack build crates/thaime_wasm --target web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Copy versioned dictionary blob
        run: |
          VTAG="v$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/' | tr '.' '_')"
          DICT_FILE="thaime-${VTAG}.dict"
          mkdir -p web/public/dict
          cp "data/dict/${DICT_FILE}" "web/public/dict/${DICT_FILE}"
          echo "VITE_DICT_FILE=${DICT_FILE}" > web/.env

      - name: Install npm dependencies
        working-directory: web
        run: npm install

      - name: Build Vite
        working-directory: web
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
